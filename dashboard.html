<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ===== 基本設定 ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEIRON | SCL Team Results</title>

    <!-- ===== スタイルシート ===== -->
    <link rel="stylesheet" href="dashboard-style.css">
    <link rel="stylesheet" href="style.css">

    <!-- ===== フォント読み込み ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ===== ダッシュボード コンテンツ ===== -->
    <main class="dashboard-main">

        <!-- ===== ページタイトル ===== -->
        <section class="dashboard-header">
            <h1>SCL Team Results</h1>
            <!-- シーズンフィルター -->
            <div id="season-filter-container" class="season-filter-container"></div>
        </section>

        <!-- ===== ページナビゲーション ===== -->
        <nav class="page-navigation">
            <a href="player-stats.html" class="nav-link">Player Statistics →</a>
        </nav>

        <!-- ===== 統計情報セクション ===== -->
        <section class="statistics-section">
            <h2>Statistics</h2>
            <div id="statistics-container" class="stats-container">
                <!-- dashboard.js で動的に生成される -->
                <div class="loading-placeholder">統計情報を読み込み中...</div>
            </div>
        </section>

        <!-- ===== 戦績カード一覧セクション ===== -->
        <section class="matches-section">
            <h2>Match Results</h2>
            <div id="matches-container" class="matches-container">
                <!-- dashboard.js で動的に生成される -->
                <div class="loading-placeholder">戦績データを読み込み中...</div>
            </div>
        </section>

    </main>

    <!-- ===== JavaScriptファイル読み込み ===== -->
    <script src="rankings.js"></script>
    <script src="dashboard.js"></script>

</body>

</html>
