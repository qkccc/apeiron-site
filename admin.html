<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEIRON | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/web-analytics/script.js"></script>
    <style>
        /* 管理画面専用スタイル */
        body {
            padding-top: 80px;
        }

        .admin-header {
            background: #1a1a1a;
            border-bottom: 1px solid #D4AF37;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
        }

        .container {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* カード型レイアウト */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .sheet-card {
            background: #151515;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
        }

        .sheet-card:hover {
            transform: translateY(-5px);
            border-color: #D4AF37;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .card-icon {
            color: #2ebd59;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        /* スプレッドシートっぽい緑色 */
        .card-title {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-link {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: auto;
            /* 下揃え */
        }

        .card-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
        }

        p {
            color: #888;
        }
    </style>
</head>

<body>

    <!-- 管理画面ヘッダー -->
    <header class="admin-header">
        <div style="font-family: 'Montserrat'; font-weight: 900; color: #fff;">APEIRON <span
                style="color:#D4AF37">ADMIN</span></div>
        <button id="logoutBtn"
            style="background:none; border:1px solid #666; color:#ccc; padding:5px 15px; cursor:pointer;">LOGOUT</button>
    </header>

    <div class="container">
        <h1>Admin Dashboard</h1>
        <p>チーム管理用スプレッドシート一覧</p>

        <div class="grid-container">
            <!-- 1. SCL戦績管理 -->
            <div class="sheet-card">
                <div>
                    <div class="card-icon"><i class="fa-solid fa-file-csv"></i></div>
                    <div class="card-title">SCL 戦績管理</div>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/1RbpwN1sLMJ7SwyXB1e3NGvehiYMH1ChbnHaR_xeEyL4/edit?usp=sharing"
                    target="_blank" class="card-link">
                    シートを開く <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <!-- 2. SLL戦績管理 -->
            <div class="sheet-card">
                <div>
                    <div class="card-icon"><i class="fa-solid fa-file-csv"></i></div>
                    <div class="card-title">SLL 戦績管理</div>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/1dkDsPSOigAnr5OzHX3pCxwNBYvCHC_caqVqvnCmmagA/edit?usp=sharing"
                    target="_blank" class="card-link">
                    シートを開く <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <!-- 3. Apeiron大型内戦 -->
            <div class="sheet-card">
                <div>
                    <div class="card-icon"><i class="fa-solid fa-trophy"></i></div>
                    <div class="card-title">Apeiron 大型内戦</div>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/1ZFB2-cNe6BWXkSMVAy4h6FI2HXJezd0D5v749_lOn08/edit?usp=sharing"
                    target="_blank" class="card-link">
                    シートを開く <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <!-- 4. 対抗戦結果 -->
            <div class="sheet-card">
                <div>
                    <div class="card-icon"><i class="fa-solid fa-handshake-simple"></i></div>
                    <div class="card-title">対抗戦結果</div>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/1ZRnVcTWIsQDUFSTkhBIuQs1las5UsvFtgNgFywhoyVM/edit?usp=sharing"
                    target="_blank" class="card-link">
                    シートを開く <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
