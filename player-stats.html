<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ===== 基本設定 ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEIRON | Player Statistics</title>

    <!-- ===== スタイルシート ===== -->
    <link rel="stylesheet" href="player-stats-style.css">
    <link rel="stylesheet" href="style.css">

    <!-- ===== フォント読み込み ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ===== ヘッダーナビゲーション ===== -->
    <header>
        <a href="index.html" class="logo">
            <img src="https://static.wixstatic.com/media/0b2d0a_02bb0feb79f04127994e2a62bcaacbe8~mv2.jpg"
                alt="APEIRON Logo">
        </a>
        <nav>
            <a href="about.html">ABOUT</a>
            <a href="members.html">MEMBERS</a>
            <a href="achievements.html">ACHIEVEMENTS</a>
        </nav>
    </header>

    <!-- ===== メインコンテンツ ===== -->
    <main class="player-stats-main">

        <!-- ===== ヘッダー ===== -->
        <div class="player-stats-header">
            <h1>Player Statistics</h1>
            <p>個人戦績 - シーズン別・クラス別統計</p>
        </div>

        <!-- ===== セクション1: 全シーズン通しての出場・勝敗 ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>全シーズン通しての出場・勝敗</h2>
            </div>
            <div id="overall-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション2: シーズンごとの戦績(プレイヤー名ごと) ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>シーズンごとの戦績 - プレイヤー別</h2>
                <div class="section-filter">
                    <label for="season-player-filter">シーズン:</label>
                    <select id="season-player-filter" class="filter-select">
                        <option value="all">全シーズン</option>
                    </select>
                </div>
            </div>
            <div id="season-player-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション3: シーズンごとの戦績(クラスごと) ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>シーズンごとの戦績 - クラス別</h2>
                <div class="section-filter">
                    <label for="season-class-filter">シーズン:</label>
                    <select id="season-class-filter" class="filter-select">
                        <option value="all">全シーズン</option>
                    </select>
                </div>
            </div>
            <div id="season-class-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション4: 各クラスのシーズンごとの戦績 ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>各クラスのシーズンごとの戦績</h2>
                <div class="section-filter">
                    <label for="class-season-filter">クラス:</label>
                    <select id="class-season-filter" class="filter-select">
                        <option value="all">全クラス</option>
                    </select>
                </div>
            </div>
            <div id="class-season-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション5: 各プレイヤーのクラスごとの戦績(1試合出場以上) ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>各プレイヤーのクラスごとの戦績</h2>
                <div class="section-filter">
                    <label for="player-class-filter">プレイヤー:</label>
                    <select id="player-class-filter" class="filter-select">
                        <option value="all">全員</option>
                    </select>
                </div>
            </div>
            <div id="player-class-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション6: 各プレイヤーの全シーズン通してのクラスごとの戦績 ===== -->
        <section class="stats-section">
            <div class="section-header">
                <h2>各プレイヤーの全シーズン通してのクラスごとの戦績</h2>
            </div>
            <div id="player-class-allseason-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

    </main>

    <!-- ===== JavaScriptファイル読み込み ===== -->
    <script src="player-stats.js"></script>

</body>

</html>
