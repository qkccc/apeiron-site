<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ===== 基本設定 ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEIRON | Player Statistics</title>

    <!-- ===== スタイルシート ===== -->
    <link rel="stylesheet" href="player-stats-style.css">
    <link rel="stylesheet" href="style.css">

    <!-- ===== フォント読み込み ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/web-analytics/script.js"></script>
</head>

<body>

    <!-- ===== メインコンテンツ ===== -->
    <main class="player-stats-main">

        <!-- ===== ヘッダー ===== -->
        <div class="player-stats-header">
            <h1>Player Statistics</h1>
            <p>個人戦績</p>
        </div>

        <!-- ===== ページナビゲーション ===== -->
        <nav class="page-navigation">
            <a href="dashboard.html" class="nav-link">SCL Team Results →</a>
        </nav>

        <!-- ===== セクション選択ナビゲーション ===== -->
        <div class="section-navigation">
            <button class="nav-button active" data-section="1">総合戦績</button>
            <button class="nav-button" data-section="2">各シーズン</button>
            <button class="nav-button" data-section="3">各クラス</button>
            <button class="nav-button" data-section="4">各プレイヤー</button>
        </div>

        <!-- ===== セクション1: 全シーズン通しての出場・勝敗 ===== -->
        <section class="stats-section" id="section-1">
            <div class="section-header">
                <h2>総合戦績</h2>
            </div>
            <div id="overall-stats-container" class="table-container">
                <!-- player-stats.js で動的生成 -->
            </div>
        </section>

        <!-- ===== セクション2: 各シーズン ===== -->
        <section class="stats-section" id="section-2">
            <div class="section-header">
                <h2>各シーズン</h2>
            </div>

            <div class="subsection-navigation">
                <button class="sub-nav-button active" data-subgroup="season" data-subsection="player">プレイヤー別</button>
                <button class="sub-nav-button" data-subgroup="season" data-subsection="class">クラス別</button>
            </div>

            <div class="subsection-block stats-subsection active" id="season-sub-player" data-subgroup="season"
                data-subsection="player">
                <div class="subsection-header">
                    <h3>各シーズン・プレイヤー別</h3>
                    <div class="section-filter">
                        <label for="season-player-filter">シーズン:</label>
                        <select id="season-player-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="season-player-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>

            <div class="subsection-block stats-subsection" id="season-sub-class" data-subgroup="season"
                data-subsection="class">
                <div class="subsection-header">
                    <h3>各シーズン・クラス別</h3>
                    <div class="section-filter">
                        <label for="season-class-filter">シーズン:</label>
                        <select id="season-class-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="season-class-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>
        </section>

        <!-- ===== セクション3: 各クラス ===== -->
        <section class="stats-section" id="section-3">
            <div class="section-header">
                <h2>各クラス</h2>
            </div>

            <div class="subsection-navigation">
                <button class="sub-nav-button active" data-subgroup="class" data-subsection="player">プレイヤー別</button>
                <button class="sub-nav-button" data-subgroup="class" data-subsection="season">シーズン別</button>
            </div>

            <div class="subsection-block stats-subsection active" id="class-sub-player" data-subgroup="class"
                data-subsection="player">
                <div class="subsection-header">
                    <h3>各クラス・プレイヤー別</h3>
                    <div class="section-filter">
                        <label for="class-player-filter">クラス:</label>
                        <select id="class-player-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="class-player-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>

            <div class="subsection-block stats-subsection" id="class-sub-season" data-subgroup="class"
                data-subsection="season">
                <div class="subsection-header">
                    <h3>各クラス・シーズン別</h3>
                    <div class="section-filter">
                        <label for="class-season-filter">クラス:</label>
                        <select id="class-season-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="class-season-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>
        </section>

        <!-- ===== セクション4: 各プレイヤーのクラスごとの戦績 ===== -->
        <section class="stats-section" id="section-4">
            <div class="section-header">
                <h2>各プレイヤー</h2>
            </div>

            <div class="subsection-navigation">
                <button class="sub-nav-button active" data-subgroup="player" data-subsection="class">クラス別</button>
                <button class="sub-nav-button" data-subgroup="player" data-subsection="season">シーズン別</button>
            </div>

            <div class="subsection-block stats-subsection active" id="player-sub-class" data-subgroup="player"
                data-subsection="class">
                <div class="subsection-header">
                    <h3>各プレイヤー・クラス別</h3>
                    <div class="section-filter">
                        <label for="player-class-filter">プレイヤー:</label>
                        <select id="player-class-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="player-class-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>

            <div class="subsection-block stats-subsection" id="player-sub-season" data-subgroup="player"
                data-subsection="season">
                <div class="subsection-header">
                    <h3>各プレイヤー・シーズン別</h3>
                    <div class="section-filter">
                        <label for="player-season-filter">プレイヤー:</label>
                        <select id="player-season-filter" class="filter-select">
                        </select>
                    </div>
                </div>
                <div id="player-season-stats-container" class="table-container">
                    <!-- player-stats.js で動的生成 -->
                </div>
            </div>
        </section>

    </main>

    <!-- ===== JavaScriptファイル読み込み ===== -->
    <script src="player-stats.js"></script>

</body>

</html>
